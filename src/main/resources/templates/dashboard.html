<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-wrap">
    <div class="glass-card">

        <div class="alert alert-soft-success mb-3" th:if="${updated}">
            Your profile was updated successfully.
        </div>

        <div class="profile-header">
            <div class="avatar-circle" th:text="${#strings.substring(student.name,0,1)}">S</div>
            <div>
                <p class="brand-title mb-0" th:text="${student.name}">Student Name</p>
                <p class="subtitle mb-0" th:text="${student.email}">student@example.com</p>
            </div>
        </div>

        <div class="info-row">
            <span class="info-label">Section</span>
            <span class="info-value" th:text="${student.section}">A1</span>
        </div>
        <div class="info-row">
            <span class="info-label">GPA</span>
            <span class="gpa-pill" th:text="${#numbers.formatDecimal(student.gpa, 1, 2)}">8.75</span>
        </div>
        <div class="info-row">
            <span class="info-label">Email</span>
            <span class="info-value" th:text="${student.email}">student@example.com</span>
        </div>

        <div class="action-row">
            <a th:href="@{/edit}" class="btn btn-outline-soft text-center">Edit Profile</a>
            <form th:action="@{/logout}" method="get">
                <button type="submit" class="btn btn-primary-gradient">Log Out</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
