<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-wrap">
    <div class="glass-card">
        <div class="brand">
            <div class="brand-badge">SM</div>
            <p class="brand-title">Student Portal</p>
        </div>
        <p class="subtitle">Log in to view and manage your student profile.</p>

        <div class="alert alert-soft-success mb-3" th:if="${registered}">
            Registration successful! Please log in with your new account.
        </div>
        <div class="alert alert-soft-danger mb-3" th:if="${loginError}" th:text="${loginError}"></div>

        <form th:action="@{/login}" th:object="${loginForm}" method="post" novalidate>
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" class="form-control" th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                       placeholder="you@example.com">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" th:field="*{password}"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                       placeholder="••••••••">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <button type="submit" class="btn btn-primary-gradient mt-2">Log In</button>
        </form>

        <div class="switch-link">
            Don't have an account? <a th:href="@{/register}">Create one</a>
        </div>
    </div>
</div>
</body>
</html>
