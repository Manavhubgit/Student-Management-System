<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile · Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-wrap">
    <div class="glass-card">
        <div class="brand">
            <div class="brand-badge">SM</div>
            <p class="brand-title">Edit Profile</p>
        </div>
        <p class="subtitle">Update your details below.</p>

        <form th:action="@{/edit}" th:object="${editProfileForm}" method="post" novalidate>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" th:field="*{name}"
                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                <div class="form-hint">First letter of each word must be capital (e.g. Rahul Sharma).</div>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Section</label>
                <input type="text" class="form-control" th:field="*{section}" maxlength="2"
                       th:classappend="${#fields.hasErrors('section')} ? 'is-invalid' : ''">
                <div class="form-hint">One capital letter followed by one digit (e.g. A1, B3).</div>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('section')}" th:errors="*{section}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">GPA</label>
                <input type="number" step="0.01" min="0" max="10" class="form-control" th:field="*{gpa}"
                       th:classappend="${#fields.hasErrors('gpa')} ? 'is-invalid' : ''">
                <div class="form-hint">A number between 0.0 and 10.0, up to 2 decimal places.</div>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('gpa')}" th:errors="*{gpa}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                <div class="form-hint">Must contain '@' and a valid domain.</div>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">New Password <span class="form-hint" style="display:inline">(optional)</span></label>
                <input type="password" class="form-control" th:field="*{newPassword}"
                       th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''"
                       placeholder="Leave blank to keep current password">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
            </div>

            <button type="submit" class="btn btn-primary-gradient mt-2">Save Changes</button>
        </form>

        <div class="switch-link">
            <a th:href="@{/dashboard}">← Back to dashboard</a>
        </div>
    </div>
</div>
</body>
</html>
